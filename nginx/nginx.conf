# Single entry point of the stack (127.0.0.1:8080 -> api:8000). Client headers, X-API-Key included, are passed through.

# Rate limits per client IP: a general one, and a stricter one for the agent (each answer is several LLM calls).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ask_limit:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_tokens off;
    # Requests are small JSON documents (a question is at most 500 characters).
    client_max_body_size 16k;

    # Docker's internal DNS, re-resolved every 10 s: the proxy keeps working when the api container is recreated
    # with a new IP (a fixed proxy_pass host is resolved only once, at start).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;

    location / {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_read_timeout 120s;
        proxy_pass $api_upstream;
    }

    # The agent: a local model on CPU can take a few minutes for one answer.
    location = /api/ask {
        limit_req zone=ask_limit burst=5 nodelay;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass $api_upstream;
    }
}
