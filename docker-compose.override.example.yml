# Optional, macOS: use the native Ollama app (Metal GPU, much faster than the CPU-only container) for the agent.
#   1. Install Ollama from https://ollama.com, then: ollama pull llama3.1:8b
#   2. cp docker-compose.override.example.yml docker-compose.override.yml   (auto-loaded by docker compose, ignored by Git)
#   3. make docker-up
# The ollama and ollama-pull containers are then not started, and the API calls the host through host.docker.internal.
services:
  api:
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on: !override
      neo4j:
        condition: service_healthy
  ollama:
    profiles: [docker-ollama]
  ollama-pull:
    profiles: [docker-ollama]
