# Project tracker: the single place that says where the project stands.
# Update your own task in the SAME pull request that delivers it:
#   status: todo | in_progress | in_review | done      pr: PR number or link
# Read it with:  make status            (everything)
#                make status WHO=Adrien (your next task)
# No dates here: the project advances by phases, a phase is open when the previous gate is met.

team:
  Adrien: {role: A, reviewer: Victor}   # reviewer = who reviews this person's PRs
  Victor: {role: B, reviewer: Edgar}
  Edgar:  {role: C, reviewer: Louis}
  Louis:  {role: D, reviewer: Oscar}
  Oscar:  {role: E, reviewer: Adrien}

phases:
  0:
    name: Foundations
    gate: Repo created and protected, kit on main, contracts frozen, data go/no-go done, docker compose up works from a clean clone
    min_score: 0
  1:
    name: Data and API
    gate: Ingestion works, 5 business endpoints answer on seed data, tests at 60 percent or more
    min_score: 45
  2:
    name: Analytics and agent
    gate: GDS algorithms and ML workflow run, agent answers the evaluation questions with guardrails
    min_score: 75
  3:
    name: Finish and rehearse
    gate: All documents done, README complete, clean-clone run OK, team rehearsal done
    min_score: 90

tasks:
  # ---------------------------------------------------------------- phase 0
  - {id: L0, phase: 0, owner: Adrien, title: "Create the repo, invite everyone, commit this kit to main, protect main", criteria: [GT1, GT2], depends_on: [], status: done, pr: "direct push (before protection)"}
  - {id: E1, phase: 0, owner: Oscar, title: "CI workflows verified, CODEOWNERS filled in, badges in README", criteria: [SE1, SE2, SE3], depends_on: [L0], status: todo, pr: ""}
  - {id: D1, phase: 0, owner: Louis, title: "docker compose up works from a clean clone, health checks, .env handling", criteria: [DK1, DK2, DK3, DK5], depends_on: [L0], status: todo, pr: ""}
  - {id: A1, phase: 0, owner: Adrien, title: "Data go/no-go: download samples, docs/DATASETS.md, final scripts/schema.cypher", criteria: [NJ1, NJ2, NJ3, NJ5], depends_on: [L0], status: todo, pr: ""}
  - {id: C1, phase: 0, owner: Edgar, title: "docs/API_CONTRACT.md and docs/AGENT_SPEC.md finalized, Pydantic stubs", criteria: [FA2], depends_on: [L0], status: todo, pr: ""}
  - {id: B1, phase: 0, owner: Victor, title: "Draft of the 5 core Cypher queries and GDS algorithm choice, GDS plugin confirmed in the container", criteria: [AC1], depends_on: [L0], status: todo, pr: ""}
  # ---------------------------------------------------------------- phase 1
  - {id: A2, phase: 1, owner: Adrien, title: "Ingestion scripts for events and market series (idempotent MERGE, UNWIND batches), make schema", criteria: [NJ4, AC3], depends_on: [A1], status: todo, pr: ""}
  - {id: B2, phase: 1, owner: Victor, title: "Services: correlation (WITH, aggregations), timeline, shortest paths, with seed-data tests", criteria: [AC1, AC2], depends_on: [B1, A1], status: todo, pr: ""}
  - {id: C2, phase: 1, owner: Edgar, title: "Routers, Pydantic models, error handling wired to the services, /api/ask stub", criteria: [FA1, FA2, FA3, FA4], depends_on: [C1], status: todo, pr: ""}
  - {id: D2, phase: 1, owner: Louis, title: "API key on sensitive POST endpoints, Nginx rules, complete Makefile, image on a public registry", criteria: [DK4, SE5, MK1, MK2], depends_on: [D1], status: todo, pr: ""}
  - {id: E2, phase: 1, owner: Oscar, title: "Seed-graph fixtures, unit, API, Neo4j and Cypher tests, coverage 60 percent or more", criteria: [TS1, TS2, TS3, TS4, TS5], depends_on: [E1], status: todo, pr: ""}
  # ---------------------------------------------------------------- phase 2
  - {id: A3, phase: 2, owner: Adrien, title: "Graph schema diagram, modeling rationale, anti-genericity appendix (draft)", criteria: [SC1, SC3], depends_on: [A2], status: todo, pr: ""}
  - {id: B3, phase: 2, owner: Victor, title: "GDS projection, PageRank, Louvain, ML pipeline producing hypothesis claims", criteria: [GD1, GD2], depends_on: [B2, A2], status: todo, pr: ""}
  - {id: C3, phase: 2, owner: Edgar, title: "LangGraph agent, tools, structured output, guardrails, evaluation set", criteria: [GD3, GD4], depends_on: [C2, B2], status: todo, pr: ""}
  - {id: D3, phase: 2, owner: Louis, title: "Architecture diagram, clean-clone rehearsal of make docker-run", criteria: [SC2, MK3], depends_on: [D2], status: todo, pr: ""}
  - {id: E3, phase: 2, owner: Oscar, title: "Review log, pylint and docstring sweep, scorecard in good state", criteria: [SE4, CC1, CC2, CC3], depends_on: [E2], status: todo, pr: ""}
  # ---------------------------------------------------------------- phase 3
  - {id: A4, phase: 3, owner: Adrien, title: "demo.ipynb with visualizations, final modeling rationale", criteria: [DC2, SC3], depends_on: [A3, C3], status: todo, pr: ""}
  - {id: B4, phase: 3, owner: Victor, title: "docs/benchmarks.md: EXPLAIN and PROFILE, before and after numbers", criteria: [OP1, SE6], depends_on: [B3], status: todo, pr: ""}
  - {id: C4, phase: 3, owner: Edgar, title: "Final README with screenshots, docs/llm_guardrails.md", criteria: [DC1, GD4], depends_on: [C3], status: todo, pr: ""}
  - {id: D4, phase: 3, owner: Louis, title: "Final make help, lint, test, docker-run from a clean clone, registry link in README", criteria: [DK5, DK4, MK2], depends_on: [D3], status: todo, pr: ""}
  - {id: E4, phase: 3, owner: Oscar, title: "Final lint, tests, scorecard and coverage report", criteria: [CC1, TS4, TS5], depends_on: [E3], status: todo, pr: ""}
  - {id: R, phase: 3, owner: All, title: "Team rehearsal of the defense, final make score and git shortlog -sn, README contribution table", criteria: [GT3, GT4, GT5], depends_on: [A4, B4, C4, D4, E4], status: todo, pr: ""}
